name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and check the app bundle
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          clang --version | head -1
          # The panel uses NSGlassEffectView, which needs the macOS 26 SDK to compile at all -
          # #available only guards the runtime. Fail loudly here rather than in a wall of
          # "cannot find NSGlassEffectView in scope".
          sdk=$(xcrun --show-sdk-version)
          echo "macOS SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "FAIL: need the macOS 26 SDK or newer"; exit 1; }

      - name: Test
        run: ./test.sh

      - name: Build
        run: ./build.sh

      - name: Check the bundle is complete
        run: |
          set -euo pipefail
          APP=build/Hush.app
          fail=0
          for path in \
            "$APP/Contents/MacOS/Hush" \
            "$APP/Contents/Info.plist" \
            "$APP/Contents/Resources/mediaremote-adapter.pl" \
            "$APP/Contents/Resources/MediaRemoteAdapter.framework/MediaRemoteAdapter" \
            "$APP/Contents/Resources/hush"
          do
            if [ -e "$path" ]; then
              echo "ok    $path"
            else
              echo "MISSING $path"; fail=1
            fi
          done
          exit $fail

      - name: Check both binaries are universal and the signature verifies
        run: |
          set -euo pipefail
          for bin in build/Hush.app/Contents/MacOS/Hush build/Hush.app/Contents/Resources/hush; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            echo "$archs" | grep -q arm64
            echo "$archs" | grep -q x86_64
          done
          # the CLI must not be the app binary: on a case-insensitive filesystem that mistake
          # is silent, so compare them
          cmp -s build/Hush.app/Contents/MacOS/Hush build/Hush.app/Contents/Resources/hush \
            && { echo "FAIL: the CLI and the app are the same binary"; exit 1; }
          echo "ok: the app and the CLI are distinct binaries"
          codesign --verify --deep --strict --verbose=2 build/Hush.app

      - name: Check the CLI answers
        run: |
          set -euo pipefail
          build/Hush.app/Contents/Resources/hush --help | head -3
          # no headphones on a runner, so it must fail cleanly rather than hang or crash
          out=$(build/Hush.app/Contents/Resources/hush status --json || true)
          echo "$out"
          echo "$out" | grep -q '"ok"'
          echo "ok: the CLI exits cleanly with no device present"

      - name: Check the adapter framework exports the symbols the perl script calls
        run: |
          set -euo pipefail
          FW=build/Hush.app/Contents/Resources/MediaRemoteAdapter.framework/MediaRemoteAdapter
          for sym in adapter_get_env adapter_stream_env adapter_send_env adapter_test; do
            if nm -gU "$FW" | grep -q "_$sym$"; then
              echo "ok      $sym"
            else
              echo "MISSING $sym"; exit 1
            fi
          done

      - name: Check the opcode policy
        run: python3 .github/scripts/check_opcodes.py

      - uses: actions/upload-artifact@v4
        with:
          name: Hush.app
          path: build/Hush.app
          if-no-files-found: error
