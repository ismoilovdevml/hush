<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hush</title>
<style>
/* Win11 Fluent styling — reused from the supplied tray-flyout design. */
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
.acrylic{background:rgba(36,36,40,.92);backdrop-filter:blur(40px) saturate(1.5)}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:6px}
.t2{color:#C5C5C5}.t3{color:#A0A0A0}
button,select{font-family:inherit;cursor:pointer}
.qs{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;border:0;background:transparent;padding:0;color:#fff;font-size:12px}
.qs .tile{width:100%;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;transition:background .1s}
.qs:hover .tile{background:rgba(255,255,255,.09)}
.qs.on .tile{background:#60CDFF;border-color:#60CDFF;color:#000}
.qs.on:hover .tile{background:#5ABAE6}
.ib{width:36px;height:36px;border:0;border-radius:5px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.ib:hover{background:rgba(255,255,255,.07)}
.ts{width:40px;height:20px;border-radius:10px;box-sizing:border-box;border:1px solid rgba(255,255,255,.6);position:relative;flex:none;transition:background .1s}
.ts::after{content:"";position:absolute;top:3px;left:4px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.8);transition:left .12s}
.ts.on{background:#60CDFF;border-color:#60CDFF}.ts.on::after{left:22px;background:#000}
.cb{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-bottom-color:rgba(255,255,255,.2);border-radius:5px;color:#fff;font-size:13px;padding:0 32px 0 11px;height:32px}
.cb option{background:#2C2C2C}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#60CDFF var(--p),rgba(255,255,255,.55) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#60CDFF;border:5px solid #454545;box-sizing:border-box;margin-top:-8px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hz{color:#A0A0A0;font-size:10px}
.band{position:relative;width:4px;height:84px;border-radius:2px;background:rgba(255,255,255,.3)}
.band .fill{position:absolute;left:0;width:4px;border-radius:2px;background:#60CDFF}
.band .knob{position:absolute;left:-6px;width:16px;height:16px;box-sizing:border-box;border-radius:50%;background:#60CDFF;border:4px solid #454545}
#offline{display:none;padding:10px 12px;margin:0 16px 12px;border-radius:6px;background:rgba(255,120,80,.12);border:1px solid rgba(255,120,80,.3);font-size:12px;color:#ffd0c0}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="acrylic" style="width:360px;border-radius:8px;border:1px solid rgba(255,255,255,.09);overflow:hidden">
  <div style="padding:16px 16px 12px;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;align-items:center;gap:12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600" id="name">WH-1000XM6</div><div class="t2" style="font-size:12px" id="sub">Connecting…</div></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-variant-numeric:tabular-nums" id="battwrap"><span id="batt">—</span></div>
    </div>

    <div id="offline">Headphones not connected. Pair and connect the WH-1000XM6, then reopen.</div>

    <div style="display:flex;gap:8px" role="group" aria-label="Sound mode">
      <button class="qs" data-anc="off"><span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"></circle><path d="M6.5 6.5l11 11"></path></svg></span>Off</button>
      <button class="qs" data-anc="nc"><span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 11v2"></path><path d="M4 4l16 16"></path></svg></span>Noise cancelling</button>
      <button class="qs" data-anc="ambient"><span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 9a4 4 0 1 1 7.5 2c-1 1.6-2.5 2.2-2.5 4.5a2.5 2.5 0 0 1-4.5 1.5"></path><path d="M18 8c1 1 1.5 2.4 1.5 4s-.5 3-1.5 4"></path></svg></span>Ambient sound</button>
    </div>

    <div id="ambrow" class="hidden" style="display:flex;align-items:center;gap:12px">
      <label for="amb" class="t2" style="font-size:12px;white-space:nowrap">Ambient level</label>
      <input id="amb" type="range" min="1" max="20" value="10">
      <span style="font-size:12px;width:18px;text-align:right;font-variant-numeric:tabular-nums" id="ambval">10</span>
    </div>

    <div class="sc" style="padding:12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <label for="eqp" style="font-size:14px;font-weight:600">Equalizer</label>
        <span style="position:relative;display:inline-flex">
          <select id="eqp" class="cb"></select>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" style="position:absolute;right:10px;top:10px;pointer-events:none"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </div>
      <div id="bands" style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px"></div>
    </div>

    <button id="dsee" class="sc" role="switch" aria-checked="false" style="display:flex;align-items:center;gap:12px;width:100%;padding:12px;color:#fff;text-align:left;min-height:60px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.5L12 15l-1.8-4.5L5.5 9l4.7-1.4z"></path></svg>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:14px">DSEE Extreme</span><span class="t2" style="font-size:12px">Upscale compressed audio</span></span>
      <span class="t2" style="font-size:13px" id="dseetxt">Off</span>
      <span class="ts" id="dseets"></span>
    </button>

  </div>

  <div style="display:flex;align-items:center;gap:4px;padding:6px 8px 6px 16px;background:rgba(0,0,0,.22);border-top:1px solid rgba(255,255,255,.07)">
    <span class="t2" style="flex:1;display:flex;align-items:center;gap:8px;font-size:12px"><span id="fwdot" style="width:6px;height:6px;border-radius:50%;background:#6CCB5F"></span><span id="fw">Firmware —</span></span>
  </div>
</div>
<script src="flyout.js"></script>
</body>
</html>
